name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # --ignore-scripts skips the Phase-1 Expo app's install scripts
      # (react-native-screens' `bob build && husky install`) which aren't
      # available/needed in CI; then restore just what the portal needs.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild   # vitest needs the esbuild binary
      # Lockfile was generated on macOS; install the Linux rollup native binary
      # vitest needs (npm optional-deps bug npm/cli#4828).
      - run: npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
      - run: node scripts/ensure-web-styled-jsx.cjs   # root postinstall (web styled-jsx)
      # Portal workspaces only — apps/mobile carries its own pre-existing type debt.
      - run: npm run typecheck --workspace=@agile/web --workspace=@agile/shared --workspace=@agile/supabase-client
      - run: npm test --workspace=@agile/shared

  # TODO (Agile): re-enable SQL lint. It needs a running local DB with migrations
  # applied, and the CLI flag was renamed (--linter-level → --level). To restore:
  #   - uses: supabase/setup-cli@v1
  #   - run: supabase db start && supabase db reset
  #   - run: supabase db lint --schema public,storage --level error --fail-on error
  # Disabled for now — it never started a DB, so it only ever produced a red X.
  # supabase-lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: supabase/setup-cli@v1
  #       with:
  #         version: latest
  #     - run: supabase db lint --schema public,storage --linter-level error

  no-data-in-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure /data does not contain anything besides README
        run: |
          set -e
          forbidden=$(find data -type f ! -name 'README.md' ! -name '.gitkeep' 2>/dev/null || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: /data may only contain README.md or .gitkeep. Found:"
            echo "$forbidden"
            exit 1
          fi
