# Supabase local development config.
# Project ref / Team plan + BAA is configured in the hosted dashboard, NOT here.
# This file governs the local dev stack used by `supabase start`.

project_id = "agile"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "agile://", "exp://"]
jwt_expiry = 1800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"

[auth.sms]
enable_signup = false
enable_confirmations = false

# Apple Sign-In — set credentials via SUPABASE_AUTH_EXTERNAL_APPLE_* env vars in prod.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""

# Google Sign-In for Android parity.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false

[experimental]
orioledb_version = ""
